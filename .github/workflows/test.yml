name: Configuration and launcher tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - name: Shell syntax
        run: bash -n qwen3.5-4b/serve.sh
